# Publish the Token eligibility demo (web/) to GitHub Pages on every push to main, as an
# optional mirror. The production destination is the custom-domain server described in
# docs/DEPLOYMENT.md. The page is a static build; every check it performs runs in the
# visitor's browser against the public Portaldot V3 testnet nodes. Nothing here holds a
# key or signs anything.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the vendored package artifact
        run: cd vendor && grep -v '^#' CHECKSUMS.txt | sha256sum -c -
      - run: npm ci
      - run: npm test
      - name: Build the browser app under the repository path
        run: WEB_BASE="/${GITHUB_REPOSITORY#*/}/" npm run web:build
      - name: Record what was built
        run: node scripts/hosting-manifest.mjs --dist dist-web --commit "$GITHUB_SHA" --repository "$GITHUB_REPOSITORY" --run "$GITHUB_RUN_ID" --site "https://${GITHUB_REPOSITORY_OWNER}.github.io/${GITHUB_REPOSITORY#*/}/"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
