# Offline acceptance for the allow-list consumer. Everything in the `offline` job runs
# without network access: the package is installed from the vendored tarball, the tests
# replay reads captured on the Portaldot V3 testnet, and the fixture checks prove both
# directions (the valid fixture must pass, every refusal fixture must fail). Each case
# keeps its allow-list, evaluation, inputs and decision-evidence documents as an artifact,
# and every decision-evidence document is reconstructed by the second-reader command.
#
# The `live` job is manual only. It reads the public testnet nodes and fails when they do
# not answer, because an unavailable verification is `unknown`, never a pass.
name: allowlist

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  offline:
    name: Offline tests, fixture checks and reconstruction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify the vendored package artifact
        run: cd vendor && grep -v '^#' CHECKSUMS.txt | sha256sum -c -
      - name: Install from the vendored tarball
        run: npm ci
      - name: Unit and scenario tests (command line, evaluator, selector, decision evidence)
        run: npm test
      - name: Fixture check that must pass (approved revision 2, correct entry)
        run: npm run check -- --fixture fixtures/valid-r2.json --out .ci-out/valid-r2
      - name: Fixture checks that must fail (wrong entry, superseded, revoked, unavailable, expired)
        run: |
          set -e
          fail_case() {
            if npm run check -- "$@"; then echo "::error::$* was allowed; it must be denied"; exit 1; fi
            echo "denied as expected: $*"
          }
          fail_case --fixture fixtures/valid-r2.json --config fixtures/config-wrong-decimals.json --out .ci-out/wrong-decimals
          fail_case --fixture fixtures/superseded-r1.json --out .ci-out/superseded-r1
          fail_case --fixture fixtures/revoked-r2.json --out .ci-out/revoked-r2
          fail_case --fixture fixtures/unavailable.json --out .ci-out/unavailable
          fail_case --fixture fixtures/valid-r2.json --now 2026-11-02T09:43:18.329Z --out .ci-out/expired
      - name: Reconstruct every decision from its evidence document alone
        run: |
          set -e
          for dir in valid-r2 wrong-decimals superseded-r1 revoked-r2 expired; do
            node src/reconstruct.js ".ci-out/$dir/decision-evidence.json"
          done
          test ! -f .ci-out/unavailable/decision-evidence.json || node src/reconstruct.js .ci-out/unavailable/decision-evidence.json
      - name: Release gate on captured reads (permitted): the catalog release is written and read in another process
        run: |
          set -e
          npm run release:fixture
          NOW=$(node -e "console.log(require('./.ci-out/releases/catalog-release-1.json').generatedAt)")
          npm run release:read -- .ci-out/releases/catalog-release-1.json --now "$NOW"
          node -e "const o=require('./.ci-out/releases/outcome.json'); if (o.status!=='permitted' || o.publication.status!=='published') process.exit(1); console.log('permitted: release', o.release.version, o.release.releaseHash, 'run', o.runId)"
      - name: A repeated preparation never replaces the release (exit 4, bytes unchanged)
        run: |
          set -e
          BEFORE=$(sha256sum .ci-out/releases/catalog-release-1.json)
          if npm run release:fixture; then echo "::error::the repeat was permitted; it must conflict"; exit 1; fi
          AFTER=$(sha256sum .ci-out/releases/catalog-release-1.json)
          test "$BEFORE" = "$AFTER"
          node -e "const o=require('./.ci-out/releases/outcome.json'); if (o.status!=='publication-conflict') { console.error(o); process.exit(1) } console.log('conflict as expected:', o.nextAction)"
      - name: The fresh-subject policy on the installed package: unchanged subject permitted, changed subject refused, missing subject unknown
        run: |
          set -e
          npx revivecheck-catalog prepare --config fixtures/config-fresh-subject.json --out .ci-out/fresh/unchanged --fixture fixtures/fresh-subject-r2.json
          if npx revivecheck-catalog prepare --config fixtures/config-fresh-subject.json --out .ci-out/fresh/changed --fixture fixtures/fresh-subject-changed-r2.json; then echo "::error::a changed subject was permitted"; exit 1; fi
          node -e "const o=require('./.ci-out/fresh/changed/outcome.json'); if (o.status!=='refused' || !o.reasons.includes('subject-changed')) { console.error(o); process.exit(1) } console.log('refused:', o.reasons.join(', '))"
          if npx revivecheck-catalog prepare --config fixtures/config-fresh-subject.json --out .ci-out/fresh/missing --fixture fixtures/valid-r2.json; then echo "::error::a missing subject read was permitted"; exit 1; fi
          node -e "const o=require('./.ci-out/fresh/missing/outcome.json'); if (o.status!=='unknown') { console.error(o); process.exit(1) } console.log('unknown, never a pass:', o.reasons.join(', '))"
      - name: Release gate on the revoked reads (refused): no release file, the outcome names the reviewer's next action
        run: |
          set -e
          if npx revivecheck-catalog prepare --config config/allowlist.json --out .ci-out/release-revoked --fixture fixtures/revoked-r2.json; then echo "::error::the revoked case was permitted; it must be refused"; exit 1; fi
          test ! -e .ci-out/release-revoked/catalog-release-1.json
          node -e "const o=require('./.ci-out/release-revoked/outcome.json'); if (o.status!=='refused' || !o.reasons.includes('approval-revoked')) { console.error(o); process.exit(1) } console.log('refused:', o.reasons.join(', '), '->', o.diagnostics.map((d)=>d.pointer+' ('+d.role+')').join('; '))"
      - name: Build the browser interface
        run: npm run web:build
      - name: Keep every case's outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixture-outputs
          path: .ci-out

  live:
    name: Live check (manual; needs the public testnet nodes)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Evaluate the allow-list against the chain
        run: npm run check -- --out .ci-out/live
      - name: Reconstruct the live decision from its evidence document
        run: node src/reconstruct.js .ci-out/live/decision-evidence.json
      - name: Release gate on fresh reads; write the catalog release only when permitted, then read it with fresh reads
        run: |
          npx revivecheck-catalog prepare --config config/allowlist.json --out .ci-out/live/releases
          npx revivecheck-catalog read .ci-out/live/releases/catalog-release-1.json --live
      - name: Keep the live outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-outputs
          path: .ci-out/live
